<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-9624604767498126">
<title>🎱 로또 번호 추천기</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9624604767498126"
     crossorigin="anonymous"></script>

<script>
const savedTheme = localStorage.getItem("theme");
const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
</script>

<style>
:root {
    color-scheme: light;
    --page-start: #6a11cb;
    --page-end: #2575fc;
    --surface: #ffffff;
    --text: #2b2d31;
    --muted: #666b75;
    --subtle: #858b96;
    --toggle-bg: rgba(255,255,255,.88);
    --shadow: rgba(17,24,39,.28);
    --button-start: #ff9800;
    --button-end: #ff6f00;
    --field-bg: #f8f9fc;
    --border: #d9dce5;
}

:root[data-theme="dark"] {
    color-scheme: dark;
    --page-start: #121629;
    --page-end: #232b48;
    --surface: #1b2034;
    --text: #f5f7ff;
    --muted: #c0c6d4;
    --subtle: #9ca5b8;
    --toggle-bg: rgba(27,32,52,.9);
    --shadow: rgba(0,0,0,.48);
    --button-start: #ffad33;
    --button-end: #ff7a00;
    --field-bg: #242a40;
    --border: #3d455f;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, var(--page-start), var(--page-end));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 88px 24px 40px;
    transition: background .3s ease, color .3s ease;
}

.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--toggle-bg);
    color: var(--text);
    border: 1px solid rgba(128,128,128,.28);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px var(--shadow);
    backdrop-filter: blur(8px);
    transition: transform .2s ease, background .3s ease, color .3s ease;
}

.theme-toggle:hover { transform: translateY(-2px); }

.theme-toggle:focus-visible,
.generate-button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
}

.container {
    width: 90%;
    max-width: 850px;
    background: var(--surface);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 15px 40px var(--shadow);
    transition: background .3s ease, box-shadow .3s ease;
}

h1 { color: var(--text); margin-bottom: 10px; }
p { color: var(--muted); margin-bottom: 25px; }

.generate-button {
    background: linear-gradient(135deg, var(--button-start), var(--button-end));
    color: white;
    border: none;
    padding: 15px 35px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s ease, filter .2s ease;
}

.generate-button:hover {
    filter: brightness(1.06);
    transform: scale(1.05);
}

#numbers { margin-top: 35px; }

.row {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

.title {
    width: 60px;
    color: var(--text);
    font-size: 20px;
    font-weight: bold;
}

.ball {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 22px;
    font-weight: bold;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.18);
    animation: pop .4s;
}

.yellow { background: #fbc02d; color: #242424; }
.blue { background: #1976d2; }
.red { background: #e53935; }
.gray { background: #757575; }
.green { background: #43a047; }

@keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.notice {
    margin-top: 25px;
    font-size: 14px;
    color: var(--subtle);
}

.inquiry {
    margin-top: 36px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
    text-align: left;
}

.inquiry-header { margin-bottom: 24px; text-align: center; }
.inquiry-header h2 { margin-bottom: 8px; color: var(--text); }
.inquiry-header p { margin: 0; }

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.field { display: flex; flex-direction: column; gap: 8px; }
.field-full { grid-column: 1 / -1; }
.field label { color: var(--text); font-size: 14px; font-weight: 700; }

.field input,
.field textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--field-bg);
    color: var(--text);
    padding: 12px 14px;
    font: inherit;
    transition: border-color .2s ease, box-shadow .2s ease;
}

.field textarea { min-height: 140px; resize: vertical; }
.field input:focus,
.field textarea:focus { outline: none; border-color: #ff8500; box-shadow: 0 0 0 3px rgba(255,133,0,.18); }

.consent {
    grid-column: 1 / -1;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
}

.consent input { width: 18px; height: 18px; margin-top: 1px; accent-color: #ff8500; }
.form-honeypot { position: absolute; left: -9999px; }

.submit-button {
    grid-column: 1 / -1;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--button-start), var(--button-end));
    color: #fff;
    padding: 14px 22px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s ease, filter .2s ease;
}

.submit-button:hover { filter: brightness(1.06); transform: translateY(-2px); }
.submit-button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

.comments {
    margin-top: 36px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
    text-align: left;
}

.comments-header {
    margin-bottom: 24px;
    text-align: center;
}

.comments-header h2 { margin-bottom: 8px; color: var(--text); }
.comments-header p { margin: 0; }
#disqus_thread { min-height: 180px; }

@media (max-width: 600px) {
    body { padding: 88px 14px 24px; }
    .container { width: 100%; padding: 30px 18px; }
    .ball { width: 46px; height: 46px; font-size: 18px; }
    .title { width: 100%; font-size: 17px; }
    .form-grid { grid-template-columns: 1fr; }
    .field-full, .consent, .submit-button { grid-column: 1; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition: none !important;
        animation: none !important;
    }
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드로 전환">
    <span id="themeIcon" aria-hidden="true">🌙</span>
    <span id="themeLabel">다크 모드</span>
</button>

<main class="container">
    <h1>🎱 로또 번호 추천기</h1>
    <p>버튼을 누르면 로또 번호 5세트를 추천합니다.</p>
    <button class="generate-button" type="button" onclick="generateLotto()">번호 추천받기</button>
    <div id="numbers" aria-live="polite"></div>
    <div class="notice">
        무작위 번호 추천 서비스입니다.<br>
        당첨을 보장하지 않습니다.
    </div>

    <section class="inquiry" aria-labelledby="inquiryTitle">
        <div class="inquiry-header">
            <h2 id="inquiryTitle">제휴 문의</h2>
            <p>함께할 아이디어가 있다면 아래 내용을 보내주세요.</p>
        </div>

        <form action="https://formspree.io/f/xgogjrnb" method="POST">
            <input type="hidden" name="_subject" value="새 제휴 문의가 도착했습니다">
            <div class="form-honeypot" aria-hidden="true">
                <label for="website">웹사이트</label>
                <input id="website" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="company">회사·단체명</label>
                    <input id="company" type="text" name="company" autocomplete="organization" placeholder="회사 또는 단체명">
                </div>

                <div class="field">
                    <label for="contactName">담당자명 <span aria-hidden="true">*</span></label>
                    <input id="contactName" type="text" name="name" autocomplete="name" placeholder="담당자 이름" required>
                </div>

                <div class="field field-full">
                    <label for="email">이메일 <span aria-hidden="true">*</span></label>
                    <input id="email" type="email" name="email" autocomplete="email" placeholder="contact@example.com" required>
                </div>

                <div class="field field-full">
                    <label for="message">문의 내용 <span aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" placeholder="제휴 목적과 제안 내용을 작성해 주세요." required></textarea>
                </div>

                <label class="consent" for="privacyConsent">
                    <input id="privacyConsent" type="checkbox" name="privacy_consent" value="동의" required>
                    <span>제휴 문의 회신을 위한 개인정보 수집 및 이용에 동의합니다.</span>
                </label>

                <button class="submit-button" type="submit">제휴 문의 보내기</button>
            </div>
        </form>
    </section>

    <section class="comments" aria-labelledby="commentsTitle">
        <div class="comments-header">
            <h2 id="commentsTitle">댓글</h2>
            <p>의견과 이야기를 자유롭게 남겨주세요.</p>
        </div>
        <div id="disqus_thread"></div>
        <noscript>
            댓글을 보려면 JavaScript를 활성화해 주세요.
            <a href="https://disqus.com/?ref_noscript">Disqus에서 댓글 보기</a>
        </noscript>
    </section>
</main>

<script>
const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");
const themeLabel = document.getElementById("themeLabel");

function updateThemeButton() {
    const isDark = document.documentElement.dataset.theme === "dark";
    themeIcon.textContent = isDark ? "☀️" : "🌙";
    themeLabel.textContent = isDark ? "화이트 모드" : "다크 모드";
    themeToggle.setAttribute("aria-label", isDark ? "화이트 모드로 전환" : "다크 모드로 전환");
    themeToggle.setAttribute("aria-pressed", String(isDark));
}

themeToggle.addEventListener("click", function () {
    const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = nextTheme;
    localStorage.setItem("theme", nextTheme);
    updateThemeButton();
});

updateThemeButton();

function getColor(num) {
    if (num <= 10) return "yellow";
    if (num <= 20) return "blue";
    if (num <= 30) return "red";
    if (num <= 40) return "gray";
    return "green";
}

function generateOneSet() {
    const nums = [];
    while (nums.length < 6) {
        const number = Math.floor(Math.random() * 45) + 1;
        if (!nums.includes(number)) nums.push(number);
    }
    return nums.sort(function (a, b) { return a - b; });
}

function generateLotto() {
    const result = document.getElementById("numbers");
    result.innerHTML = "";

    for (let index = 1; index <= 5; index += 1) {
        const row = document.createElement("div");
        row.className = "row";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = index + "조";
        row.appendChild(title);

        generateOneSet().forEach(function (number) {
            const ball = document.createElement("div");
            ball.className = "ball " + getColor(number);
            ball.textContent = number;
            row.appendChild(ball);
        });

        result.appendChild(row);
    }
}
</script>

<script>
var disqus_config = function () {
    this.page.url = window.location.href.split(/[?#]/)[0];
    this.page.identifier = "product-joco-test-home";
};

(function () {
    var documentRef = document;
    var script = documentRef.createElement("script");
    script.src = "https://joco-test.disqus.com/embed.js";
    script.setAttribute("data-timestamp", String(Date.now()));
    (documentRef.head || documentRef.body).appendChild(script);
})();
</script>
</body>
</html>
